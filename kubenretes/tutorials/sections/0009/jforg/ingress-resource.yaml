apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jforg-ingress
  namespace: artifactory-oss
spec:
  rules:
  - http:
      paths:
      - pathType: ImplementationSpecific
        path: /
        backend:
          service:
            name: artifactory-oss
            port:
              number: 8082